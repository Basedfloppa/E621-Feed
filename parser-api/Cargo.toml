[[bin]]
name = "e621-account-parser-api"
path = "src/main.rs"

[[bin]]
name = "calibrate"
path = "src/bin/calibrate/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[package]
name = "e621-account-parser-api"
version = "0.1.0"
edition = "2024"

[dependencies]
refinery = { version = "0.9", features = ["rusqlite"] }
rusqlite = { version = "0.38", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.32"
reqwest = { version = "0.12", features = ["json"] }
rocket = { version = "0.5.1", features = ["json"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = ">=0.4.38, <0.5", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
urlencoding = "2"
anyhow = "1"
toml = "0.9"
arc-swap = "1"
rocket_okapi = { version = "0.9", features = ["swagger"] }
schemars = { version = "0.8", features = ["chrono"] }
rayon = "1"
compact_str = "0.9"
getrandom = "0.2"
rand = "0.8"

# jemalloc — frees pages back to the kernel promptly after cache eviction.
# Without it, glibc's ptmalloc keeps freed small allocations (HashMap
# buckets, Strings) in internal free-lists, so RSS in `top`/Grafana stays
# high even after idle-eviction clears IDF, tag-relation, and API caches.
#
# Works for all three binaries (main server, calibrate, seed). Win is
# most dramatic on calibrate (10K small String churn per account) and
# the main server (1.4 GB RSS → 300 MB on idle).
#
# Default-off only because jemalloc-sys needs `make` + a C toolchain on
# the build host. Build with:
#   cargo build --release --features jemalloc
# Without it, `MALLOC_ARENA_MAX=2 MALLOC_TRIM_THRESHOLD_=65536` env vars
# cut glibc waste ~30-50% without a rebuild.
[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
perf_metrics = []

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[target.'cfg(debug_assertions)'.dependencies]
rocket_cors = "0.6.0"

[dev-dependencies]
# Mock HTTP server for the e621 client in integration tests. Lets the
# /process pipeline tests stand up a fake e621 on a random port and
# point `cfg().posts_domain` at it instead of hitting the live API.
wiremock = "0.6"
tempfile = "3"
serde_json = "1"
