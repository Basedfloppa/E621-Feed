[[bin]]
name = "e621-account-parser-api"
path = "src/main.rs"

[[bin]]
name = "calibrate"
path = "src/bin/calibrate/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "catalog-seed"
path = "src/bin/catalog_seed.rs"

[package]
name = "e621-account-parser-api"
version = "0.1.0"
edition = "2024"

[dependencies]
refinery = { version = "0.9", features = ["rusqlite"] }
rusqlite = { version = "0.38", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.32"
reqwest = { version = "0.12", features = ["json", "stream"] }
flate2 = "1"
csv = "1"
futures-util = "0.3"
# `rocket`'s only default feature is `http2`, and it is the only thing that pulls
# hyper 0.14's h2 0.3.x into the graph. That line is EOL (latest 0.3.27) with an
# open DoS advisory, RUSTSEC-2026-0258, patched only in 0.4.16+ — so the fix is to
# stop linking it. Nothing here needs h2c: Rocket binds 0.0.0.0:8181 plaintext and
# Caddy/nginx terminate TLS and proxy over HTTP/1.1. `rocket_cors` and
# `rocket_okapi` already depend on rocket with `default-features = false`, so this
# line was the only switch turning HTTP/2 on.
rocket = { version = "0.5.1", default-features = false, features = ["json"] }
rocket_cors = "0.6.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = ">=0.4.38, <0.5", features = ["serde"] }
# `default-features = false` drops the protobuf encoder — and with it the
# protobuf 2.x dependency that carries RUSTSEC-2024-0437. `/api/metrics` renders
# with `TextEncoder` only, so the protobuf path was never used.
prometheus = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
anyhow = "1.0.103"
toml = "0.9"
arc-swap = "1"
rocket_okapi = { version = "0.9", features = ["swagger"] }
schemars = { version = "0.8", features = ["chrono"] }
rayon = "1"
compact_str = "0.9"
getrandom = "0.2"
rand = "0.8"
url = "2"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"

# jemalloc — frees pages back to the kernel promptly after cache eviction.
# Without it, glibc's ptmalloc keeps freed small allocations (HashMap
# buckets, Strings) in internal free-lists, so RSS in `top`/Grafana stays
# high even after idle-eviction clears IDF, tag-relation, and API caches.
#
# Works for all three binaries (main server, calibrate, seed). Win is
# most dramatic on calibrate (10K small String churn per account) and
# the main server (1.4 GB RSS → 300 MB on idle).
#
# Default-off only because jemalloc-sys needs `make` + a C toolchain on
# the build host. Build with:
#   cargo build --release --features jemalloc
# Without it, `MALLOC_ARENA_MAX=2 MALLOC_TRIM_THRESHOLD_=65536` env vars
# cut glibc waste ~30-50% without a rebuild.
[features]
default = ["perf_metrics"]
jemalloc = ["dep:tikv-jemallocator"]
perf_metrics = []

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[dev-dependencies]
# Mock HTTP server for the e621 client in integration tests. Lets the
# /process pipeline tests stand up a fake e621 on a random port and
# point `cfg().posts_domain` at it instead of hitting the live API.
wiremock = "0.6"
tempfile = "3"
# Direct SQLite access for the hydrate bench's one-time seed setup.
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = { version = ">=0.4.38, <0.5", features = ["serde"] }
serde_json = "1"

# Criterion.rs — stable benchmarks for the scoring hot path.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "scoring"
harness = false

[[bench]]
name = "diversify"
harness = false

[[bench]]
name = "hydrate"
harness = false
