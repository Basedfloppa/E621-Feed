[[bin]]
name = "e621-account-parser-api"
path = "src/main.rs"

[[bin]]
name = "calibrate"
path = "src/bin/calibrate/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[package]
name = "e621-account-parser-api"
version = "0.1.0"
edition = "2024"

[dependencies]
refinery = { version = "0.9", features = ["rusqlite"] }
rusqlite = { version = "0.38", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.32"
reqwest = { version = "0.12", features = ["json"] }
rocket = { version = "0.5.1", features = ["json"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = ">=0.4.38, <0.5", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
urlencoding = "2"
anyhow = "1"
toml = "0.9"
arc-swap = "1"
rocket_okapi = { version = "0.9", features = ["swagger"] }
schemars = { version = "0.8", features = ["chrono"] }
rayon = "1"
compact_str = "0.9"
getrandom = "0.2"
rand = "0.8"

# jemalloc — required for any non-trivial calibrate run. glibc's default
# ptmalloc holds many small-allocation arenas hostage on the calibrate
# hydration + grid path (each account churns ~10K small `String`
# allocations from `Post` tags/description/sources), and never returns
# them to the kernel.
#
# Default-off only because building jemalloc-sys needs `make` + a C
# toolchain on the build host. Always build with:
#   cargo build --release --bin calibrate --features jemalloc
# If that's not an option, `MALLOC_ARENA_MAX=2 ./calibrate ...` cuts
# glibc fragmentation roughly in half at runtime without a rebuild.
[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
perf_metrics = []

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[target.'cfg(debug_assertions)'.dependencies]
rocket_cors = "0.6.0"
