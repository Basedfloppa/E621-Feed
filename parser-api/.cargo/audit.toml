# No advisories are currently accepted for this crate.
#
# This file used to ignore three of them. All three are now gone from the
# dependency graph itself, so the entries were deleted rather than left to rot —
# a stale ignore silently re-arms a real advisory if the containing crate ever
# comes back:
#
#   RUSTSEC-2026-0097 (rand)     — the lock has rand 0.8.7, inside the patched
#                                  range (`< 0.9.0, >= 0.8.6`) of the advisory.
#   RUSTSEC-2024-0437 (protobuf) — prometheus was bumped to 0.14 with
#                                  `default-features = false`, dropping the
#                                  protobuf encoder and the whole protobuf 2.x
#                                  subtree with it.
#   RUSTSEC-2026-0258 (h2 0.3)   — rocket is now built with
#                                  `default-features = false`, so its `http2`
#                                  feature no longer pulls hyper 0.14's EOL h2
#                                  0.3 line. The old note here claimed Rocket
#                                  "serves HTTP/1.1", which was wrong: Rocket
#                                  enables `http2` by default and binds
#                                  0.0.0.0:8181, so the copy was reachable.
#                                  Only reqwest's h2 0.4.18 remains.
#
# Add a new entry only per CONTRIBUTING.md ("Dependency advisories"), and revisit
# it whenever the parent dependency is upgraded.

[advisories]
ignore = []
