# Example config showing every supported key with its default value.
# Copy to `config.toml`, set the secrets at the top, and override only
# the knobs you actually want to change — everything else is optional.
#
# This file is the source of truth for default values referenced in
# `../Readme.md` and `../docs/calibration.md`. Keep it in sync with the
# `default_*` functions in `src/models/config.rs`.

# --- Required ---------------------------------------------------------------
admin_user = "username"
admin_api = "api_key"
# Secret used to derive the AES-256-GCM key that encrypts per-account e621 API
# keys at rest. Set a strong random value in production; leave empty only for
# local/dev (a fixed fallback salt is then used).
e621_key_encryption_secret = ""

# --- Top-level ---------------------------------------------------------------
# SQLite database file path (relative or absolute).
db_path = "database.db"

# Set to true ONLY when a trusted reverse proxy (nginx/Caddy) sits in front and
# overwrites X-Forwarded-For from the real socket address (our nginx-template and
# Caddyfile already do). Keep false (default) for a direct bind — when false the
# socket peer IP is used for rate-limit keying, so a remote client can't forge
# X-Forwarded-For to rotate per-IP buckets.
trust_proxy = false

# Tags stripped from imported posts (audio metadata, DNP markers).
# Plain tag names only — no e621 search syntax.
tag_blacklist = ["sound", "sound_warning", "conditional_dnp", "avoid_posting"]

# Default per-account blacklist applied at DB write when the client omits
# the `blacklist` field on POST /account or PATCH /account/<id>/blacklist.
# e621-style search syntax (negation, rating qualifiers, etc.).
default_account_blacklist = [
  "gore",
  "scat",
  "watersports",
  "young -rating:s",
  "loli",
  "shota",
]
# Base URL for e621 API calls and client-side post/artist/user/tag links.
# Keep e621.net unless you run against a mirror (e926.net, …) — then set the
# same value in parser-web/static/config.js (frontend) before building.
posts_domain = "https://e621.net"
posts_limit = 160 # e621 maximum: 320
rps_delay_ms = 250 # legacy global delay; priority delays are under [runtime]
max_retries = 2 # 0 disables retries
attempt_timeout_secs = 30 # hard timeout per HTTP attempt

# HTTP User-Agent sent to e621. e621 asks for a UA with a reachable
# contact address — replace you@example.com with your own.
user_agent = "E621AccountParser/0.1 (+https://github.com/Basedfloppa/E621-Feed; contact: you@example.com)"

# In-memory TTL cache for outbound GET requests to e621.
# Set ttl=0 to disable; max_entries limits memory usage.
# Idle eviction is controlled by `cache_idle_eviction_secs` under [runtime].
e621_cache_ttl_secs = 600     # 10 minutes
e621_cache_max_entries = 5000

# Scoring priors
# Scoring priors and per-group multipliers.
[priors]
now = "2000-1-01T12:00:00Z" # dummy, replaced with current date at load
recency_tau_days = 10.0

quality_a = 0.50
quality_b = 0.20
quality_log_bias = -3.0

mix_sim = 0.603
mix_quality = 0.017
mix_recency = 0.017
mix_rating = 0.034
mix_media = 0.042
mix_popularity = 0.017
mix_interaction = 0.084
mix_tag_relation = 0.067
mix_uploader = 0.05
uploader_n0 = 5.0          # cold-start: how many posts from an uploader needed for 50% confidence
uploader_w_avg_score = 0.6 # blend weight for avg_score component in uploader_fit
uploader_w_avg_fav = 0.4   # blend weight for avg_fav component in uploader_fit

mix_exclusivity = 0.02
min_exclusivity_cooc = 2             # pairs with cooc < this get full exclusivity credit
exclusivity_scale = 0.5              # sigmoid scale; larger = sharper threshold
exclusivity_max_tags = 15            # top-K tags by group weight in O(T²) loop (0 = no limit)
exclusivity_cross_group_weight = 0.5 # cross-group cooc weight; >1 = rare multi-group combos score higher

mix_novelty = 0.02
novelty_n0 = 3.0            # impressions needed for 50% confidence tag is "not novel"
novelty_use_feedback = true # false = only check favourites, not impression counts

mix_artist_discovery = 0.03
artist_discovery_n0 = 3.0            # new artists needed for 50% confidence
artist_discovery_novelty_bonus = 0.2 # serendipity boost for low-confidence discoveries

# IDF and frequency shaping.
df_floor = 0.40           # minimum document frequency
idf_max = 100.0           # maximum IDF value
idf_lambda = 1.00         # global IDF weight
idf_alpha = 1.05          # IDF shaping exponent
freq_alpha = 0.95         # frequency shaping exponent
bm25_k = 2.25             # BM25 saturation parameter
one_sided_ratio_exp = 0.5 # quality/popularity overshoot exponent
idf_rsj_smoothing = 0.35  # RSJ smoothing factor

# Per-group score multipliers.
group_w_artist = 2.40
group_w_character = 2.00
group_w_copyright = 1.45
group_w_species = 1.30
group_w_general = 0.60
group_w_lore = 0.40

# Cold-start and Bayesian priors.
coldstart_smoothing_boost = 2.0
interaction_ctr_prior_alpha = 4.0

# Algorithmic shape.
score_temperature = 0.0     # 0 = identity; >0 sigmoid-sharpens the final score
confidence_steepness = 1.0  # 1 = n/(n+n0); >1 sharpens warm-up
mmr_redundancy_exp = 1.0    # 1 = linear MMR penalty
tag_sim_jaccard_blend = 0.0 # 0 = pure cosine; small >0 hedges sparse profiles
exploration_epsilon = 0.0   # ε-greedy exploration bonus; 0 = disabled (default)

# Optional point splits. NaN disables a split and follows the parent value.
idf_lambda_meta = 0.40
recency_tau_recent = 4.0
recency_split_age_days = 30.0
# tag_relation_pmi_scale_user = 2.0
# Optional hot recency kernel for posts younger than recency_split_age_hours.
# recency_tau_hot             = 2.0        # NaN (default) = disabled
recency_split_age_hours = 24.0

# Categorical options.
tag_relation_pair_aggregator = "mean" # "mean" | "max" | "geomean"

# Quality channel weights (sum to 1.0).
quality_w_absolute = 0.55
quality_w_relative_score = 0.30
quality_w_relative_comments = 0.15
# Upvote-ratio weight in the quality channel. 0 = disabled.
quality_c = 0.3

# Popularity channel weights (sum to 1.0).
popularity_w_fav = 0.80
popularity_w_duration = 0.20

# Recency channel weights (sum to 1.0).
recency_w_global = 0.40
recency_w_personal = 0.60

# Diversity and MMR.
diversity_window = 32
diversity_w_artist = 0.22
diversity_w_character = 0.16
diversity_w_copyright = 1.8
diversity_w_species = 1.5
diversity_w_general = 0.08

# Discrete-preference smoothing + strong-negative veto
discrete_smoothing_alpha = 1.0
strong_negative_count = 3
strong_negative_penalty = 0.40
strong_negative_wilson_threshold = 0.55

# Personal recency window
recency_personal_floor_frac = 1.0
recency_log_personal = true

# Tag-relation graph (pmi_scale and cooc_ref tuned in v5 grid)
tag_relation_w_global = 0.4
tag_relation_w_personal = 0.6
tag_relation_pmi_scale = 3.5
tag_relation_min_cooc = 2
tag_relation_user_min_cooc = 1
tag_relation_cooc_ref = 16.0
tag_relation_user_cooc_ref = 5.0
tag_relation_max_tags = 20       # top-K tags by group weight; 0 = no limit

# Feedback decay + meta interaction
feedback_decay_half_life_days = 90.0
meta_interaction_weight = 0.3

# Cold-start and diversity caps.
coldstart_n0 = 25.0
discrete_pref_floor = 0.05
diversity_max_penalty = 0.45
diversity_interaction_damp = 0.35

# Diversity semantic similarity: blend PMI-based soft tag matching into MMR.
# 0 = pure Jaccard.
diversity_semantic_blend = 0.05  # [0-1]; 0 = disabled (pure Jaccard), >0 enables PMI soft-matching
diversity_pmi_threshold = 0.5    # minimum PMI for a soft match; pairs with PMI above this count as semantically related
diversity_semantic_max_tags = 10 # top-K tags per group for the O(T²) PMI loop
diversity_user_pmi_weight = 1.0  # amplify user-graph PMI over global in MMR (1.0 = no boost, >1 = personalized diversity)

# --- Runtime and worker tuning ----------------------------------------------
[runtime]
local_candidate_limit = 400             # local candidates per recommendations page
dedup_lookback_days = 14                # live-post deduplication window
process_fetch_concurrency = 4           # parallel pages during /process import
drop_cooc_batch_size = 50000            # co-occurrence DELETE batch size
user_relation_edge_limit = 250000       # max account cooc-pairs loaded into the MMR user graph
idf_rebuild_cooldown_secs = 15
idf_bump_drift_threshold = 200          # incremental bumps before a full IDF rebuild
tag_relation_rebuild_cooldown_secs = 15
prefetch_interval_secs = 180            # background catalog prefetcher cadence
cleanup_interval_secs = 21600           # catalog pruning interval
catalog_retention_days = 90             # retain unowned posts for this many days
orphan_retention_secs = 3600            # orphan-candidate retention period
jobs_finished_retain_secs = 600         # in-memory /process job retention
jobs_running_timeout_secs = 86400       # max wall-clock per running /process job (24 h)
prefetch_active_window_days = 14        # account activity window
prefetch_breaker_threshold = 3          # failures before pausing prefetch (0 = disabled)
prefetch_breaker_pause_secs = 600       # prefetch pause duration
prefetch_tags_per_group = 10            # top tags per group to fetch
prefetch_include_recent_popular = true  # also fetch popular posts for each top tag
prefetch_cooldown_secs = 86400          # per-account prefetch cooldown
prefetch_hot_window_hours = 48          # hot-worker account activity window
prefetch_cold_interval_secs = 900       # cold-worker interval
cache_validate_interval_secs = 300      # interval for cache cleanup
# Idle eviction for in-memory caches. 0 = disabled.
cache_idle_eviction_secs = 1800 # cache idle-eviction timeout

tag_alias_import_interval_secs = 86400 # daily sync of tag aliases / implications

live_rps_delay_ms = 250         # live request base delay (ms)
prefetch_rps_delay_ms = 500     # hot/cold prefetch base delay (ms)
backfill_rps_delay_ms = 750     # backfill worker base delay (ms)
backfill_live_window_ms = 2000  # backfill yields to live traffic for this many ms
backfill_interval_secs = 21600  # backfill worker interval (6 h)
backfill_cooldown_secs = 86400  # per-account backfill cooldown (24 h)
backfill_breaker_threshold = 10 # backfill circuit breaker threshold (0 = disabled)

# --- Calibration / seed knobs (see ../docs/calibration.md) ------------------
[backtest]
min_favs = 100
test_fraction = 0.20
negative_ratio = 10                   # negative samples per positive sample
top_k_ndcg = 20
top_k_recall = 50
max_accounts = 150
max_pages_per_user = 8                # 160 favs/page on e621
seed_owner_token = "calibration-seed"
calibrate_threads = 0                 # 0 = auto = nproc/2

# --- Local catalog & offline serving (see ../docs/offline-catalog.md) -------
# Collection is scoped by these toggles; the media cache follows what is
# collected. With both off, nothing is collected.
[catalog]
save_favourites = false            # favourites scope: collect /favourites + /process (+ direct sync)
media_cache_max_bytes = 0          # 0 = unlimited; else LRU-evict oldest originals beyond this (folder is fixed at media/)
pool_membership = false            # persist pool membership locally for offline pool navigation
save_all = false                   # additionally collect encountered posts: /digest /search /trending (and feed)
