# Example config showing every supported key with its default value.
# Copy to `config.toml`, set the secrets at the top, and override only
# the knobs you actually want to change — everything else is optional.
#
# This file is the source of truth for default values referenced in
# `../Readme.md` and `../docs/calibration.md`. Keep it in sync with the
# `default_*` functions in `src/models/config.rs`.

# --- Required ---------------------------------------------------------------
admin_user = "username"
admin_api = "api_key"

# --- Top-level ---------------------------------------------------------------
# SQLite database file path (relative or absolute).
db_path = "database.db"

# Tags stripped from imported posts (audio metadata, DNP markers).
# Plain tag names only — no e621 search syntax.
tag_blacklist = ["sound", "sound_warning", "conditional_dnp", "avoid_posting"]

# Default per-account blacklist applied at DB write when the client omits
# the `blacklist` field on POST /account or PATCH /account/<id>/blacklist.
# e621-style search syntax (negation, rating qualifiers, etc.).
default_account_blacklist = [
  "gore",
  "scat",
  "watersports",
  "young -rating:s",
  "loli",
  "shota",
]
posts_domain = "https://uri.com"
posts_limit = 160 # 320 is the e621 max
rps_delay_ms = 250
max_retries = 2 # 0 = no retries; total attempts = max_retries + 1
attempt_timeout_secs = 30 # hard tokio::time::timeout per HTTP attempt (defeats CF slow-lane that bypasses reqwest's .timeout)

# HTTP User-Agent sent to e621.
user_agent = "E621AccountParser/0.1 (+https://github.com/Basedfloppa/E621-Feed; contact: you@example.com)"

# In-memory TTL + idle-eviction cache for outbound GET requests to e621.
# Hit rate is highest on /recommendations (two devices on the same account,
# or two accounts with the same default blacklist, dedup into one round-trip).
# Set ttl=0 to disable; max_entries caps memory under abuse / typos.
# The cache is also subject to idle-eviction (see `cache_idle_eviction_secs`
# under [runtime]): after the configured period of user-request inactivity
# the entire cache is dropped so memory can return to the OS.
e621_cache_ttl_secs = 600     # 10 minutes
e621_cache_max_entries = 5000

# --- Scoring priors ---------------------------------------------------------
# v5.3: the [group_weights] section was retired. Group multipliers now live
# inline as `group_w_*` priors and are grid-tunable.
[priors]
now = "2000-1-01T12:00:00Z" # dummy, replaced with current date at load
recency_tau_days = 10.0

quality_a = 0.50
quality_b = 0.20
quality_log_bias = -3.0

mix_sim = 0.72
mix_quality = 0.02
mix_recency = 0.02
mix_rating = 0.04
mix_media = 0.05
mix_popularity = 0.02
mix_interaction = 0.10
mix_tag_relation = 0.08
# Uploader quality channel (v5.10): weight of uploader_fit in the final blend.
# 0 = disabled. Uploaders ≠ artists — they are the users who uploaded the post
# (often re-uploading others' art).
mix_uploader = 0.05
uploader_n0 = 5.0          # cold-start: how many posts from an uploader needed for 50% confidence
uploader_w_avg_score = 0.6 # blend weight for avg_score component in uploader_fit
uploader_w_avg_fav = 0.4   # blend weight for avg_fav component in uploader_fit

# Tag exclusivity channel (v5.11): ranks posts higher when they contain rare
# tag combinations. Lower co-occurrence between the post's tags = higher score.
# 0 = disabled. Set to a small non-zero value (e.g. 0.02) to enable calibration.
mix_exclusivity = 0.02
min_exclusivity_cooc = 2  # pairs with cooc < this get full exclusivity credit
exclusivity_scale = 0.5   # sigmoid scale; larger = sharper threshold
exclusivity_max_tags = 15 # top-K tags by group weight in O(T²) loop (0 = no limit)

# Tag novelty channel (v5.11): ranks posts higher when they contain tags the
# user hasn't seen before.
# 0 = disabled. Set to a small non-zero value (e.g. 0.02) to enable calibration.
mix_novelty = 0.02
novelty_n0 = 3.0   # impressions needed for 50% confidence tag is "not novel"
# novelty_use_feedback = true  # false = only check favourites, not impression counts

# IDF / frequency shaping
df_floor = 0.40           # v5.8: time_causal grid confirms 0.40 (v5.7's 0.20 was post_id-noise)
idf_max = 100.0
idf_lambda = 1.00         # stable across N=915 runs
idf_alpha = 1.05          # stable
freq_alpha = 0.95         # v5.8 reverted from v5.7 1.00; time_causal best is 0.95
bm25_k = 2.25             # v5.8 reverted from v5.7 2.40; time_causal best is 2.25
one_sided_ratio_exp = 0.5 # exponent in quality/popularity overshoot shape; 0.5 = legacy sqrt
idf_rsj_smoothing = 0.35  # v5.8 reverted from v5.7 0.25; time_causal best is 0.35

# Per-group multipliers (v5.3 — promoted from the old [group_weights] section)
# v5.8: copyright/species/general moves rolled back to v5.5 levels —
# v5.7 took those up/down too aggressively based on post_id-only data;
# the more honest time_causal grid pulls them back. group_w_general
# took a half-step from 0.80 to 0.75 toward the time_causal best (0.70).
group_w_artist = 2.40
group_w_character = 2.00
group_w_copyright = 1.45
group_w_species = 1.30
group_w_general = 0.70   # v5.10: 6 independent grids (v5.9 + v5.10) agree on 0.70
group_w_lore = 0.40

# Cold-start / Bayesian priors (v5.3 — promoted from hardcoded constants)
coldstart_smoothing_boost = 2.0
interaction_ctr_prior_alpha = 4.0

# Algorithmic shape (v5.3 — Class C, v5.8 — Class F exploration)
score_temperature = 0.0     # 0 = identity; >0 sigmoid-sharpens the final score
confidence_steepness = 1.0  # 1 = legacy n/(n+n0); >1 sharpens warm-up
mmr_redundancy_exp = 1.0    # 1 = legacy linear MMR penalty
tag_sim_jaccard_blend = 0.0 # 0 = pure cosine; small >0 hedges sparse profiles
# exploration_epsilon   = 0.0  # ε-greedy exploration bonus; 0 = disabled (default)

# Point splits (v5.3 — Class D, v5.8 — Class F hot kernel). Each split
# tracks its parent knob unless explicitly set to a numeric value (then
# the split is engaged). NaN = disabled / track parent.
# idf_lambda_meta             = 0.40
# recency_tau_recent          = 4.0
recency_split_age_days = 30.0
# tag_relation_pmi_scale_user = 2.0
# 3-piece recency kernel (Class F): hot τ for posts < recency_split_age_hours
# recency_tau_hot             = 2.0        # NaN (default) = disabled
recency_split_age_hours = 24.0

# Categorical (v5.3 — Class E)
tag_relation_pair_aggregator = "mean" # "mean" | "max" | "geomean"

# Quality channel internals (sum to 1.0)
quality_w_absolute = 0.55
quality_w_relative_score = 0.30
quality_w_relative_comments = 0.15
# Upvote-ratio weight (Class F): blend `up / (up + down)` into quality.
# 0 = disabled (legacy behaviour). Default 0.3.
quality_c = 0.3

# Popularity channel internals (sum to 1.0)
popularity_w_fav = 0.80
popularity_w_duration = 0.20

# Recency channel internals (sum to 1.0)
recency_w_global = 0.40
recency_w_personal = 0.60

# Diversity / MMR (v5.8: added copyright + species groups)
diversity_window = 32
diversity_w_artist = 0.22
diversity_w_character = 0.16
diversity_w_copyright = 1.8
diversity_w_species = 1.5
diversity_w_general = 0.08

# Discrete-preference smoothing + strong-negative veto
discrete_smoothing_alpha = 1.0
strong_negative_count = 3
strong_negative_penalty = 0.40
strong_negative_wilson_threshold = 0.55

# Personal recency window
recency_personal_floor_frac = 1.0
recency_log_personal = true

# Tag-relation graph (pmi_scale and cooc_ref tuned in v5 grid)
tag_relation_w_global = 0.4
tag_relation_w_personal = 0.6
tag_relation_pmi_scale = 3.5
tag_relation_min_cooc = 2
tag_relation_user_min_cooc = 1
tag_relation_cooc_ref = 16.0
tag_relation_user_cooc_ref = 5.0
tag_relation_max_tags = 20       # Cluster-PMI: top-K tags by group weight. 0 = no limit (legacy O(T²))

# Feedback decay + meta interaction
feedback_decay_half_life_days = 90.0
meta_interaction_weight = 0.3

# Cold-start + diversity caps
coldstart_n0 = 25.0
discrete_pref_floor = 0.05
# v5.10: raised 0.20 → 0.45. The grid converges to 0.45 across all
# 3 independent runs; the earlier 0.20 UX hedge was a response to
# "feed jumps" that have since been addressed by the diversity quota
# (enforce_diversity_quota) and interaction-aware MMR penalty.
# Offline ΔNDCG@20 remains ≤ 0.003 regardless, so the grid optimum
# carries the default.
diversity_max_penalty = 0.45
diversity_interaction_damp = 0.35

# Diversity semantic similarity (v5.11): blend PMI-based soft tag matching
# into MMR. 0 = pure Jaccard (legacy). When >0, tags with high pointwise
# mutual information count as a "soft match" even when the tag name differs.
# The non-zero affordance below gives the calibration grid room to probe
# in both directions during `grid with-diversify`.
diversity_semantic_blend = 0.05  # [0-1]; 0 = disabled (pure Jaccard), >0 enables PMI soft-matching
diversity_pmi_threshold = 0.5    # minimum PMI for a soft match; pairs with PMI above this count as semantically related
diversity_semantic_max_tags = 10 # top-K tags per group for the O(T²) PMI loop
diversity_user_pmi_weight = 1.0  # amplify user-graph PMI over global in MMR (1.0 = no boost, >1 = personalized diversity)

# --- Runtime / worker tuning ------------------------------------------------
[runtime]
local_candidate_limit = 400             # local-catalog candidates per /recommendations page
dedup_lookback_days = 14                # hide posts seen within this window
process_fetch_concurrency = 4           # parallel pages during /process import
drop_cooc_batch_size = 50000            # batched DELETE chunk for per-account cooc wipe at /process start
idf_rebuild_cooldown_secs = 15
idf_bump_drift_threshold = 200          # full IDF rebuild after this many incremental bumps
tag_relation_rebuild_cooldown_secs = 15
prefetch_interval_secs = 180            # background catalog prefetcher cadence
cleanup_interval_secs = 21600           # 6h — long-tail catalog pruning cadence (prefetch worker)
catalog_retention_days = 90             # prune posts older than this if no user owns them
orphan_retention_secs = 3600            # 1h — aggressive orphan-candidate prune (cache-pruner worker)
jobs_finished_retain_secs = 600         # 10 min — Done/Failed /process job state retained in memory
prefetch_active_window_days = 14        # only prefetch for accounts active in this window
prefetch_breaker_threshold = 3          # open circuit breaker after N consecutive e621 failures (0 = disabled)
prefetch_breaker_pause_secs = 600       # how long to pause when the breaker is open (10m)
prefetch_tags_per_group = 1             # how many top tags per group to fetch (1 = narrow, 5-10 = broad catalog)
prefetch_include_recent_popular = false # also fetch order:fav_count posts for each top tag
prefetch_cooldown_secs = 3600           # skip an account if it was prefetched within this many seconds
cache_validate_interval_secs = 300      # 5 min — cleans TTL-expired entries + checks idle-eviction for all caches
# Idle-eviction clears Rust's in-memory data structures, but glibc's
# default malloc does not necessarily return freed pages to the kernel.
# For real RSS reduction after eviction, build with jemalloc:
#   cargo build --release --features jemalloc
# Or set at runtime:
#   MALLOC_CONF=dirty_decay_ms:0 ./e621-account-parser-api
# Without jemalloc, env vars MALLOC_ARENA_MAX=2 / MALLOC_TRIM_THRESHOLD_=65536
# reduce glibc waste ~30-50%.
cache_idle_eviction_secs = 1800 # 30 min — drop API_CACHE + IDF + tag-relation graph if no requests within this window (0 = keep resident)

# --- Calibration / seed knobs (see ../docs/calibration.md) ------------------
[backtest]
min_favs = 100
test_fraction = 0.20
negative_ratio = 10                   # cached RAM ≈ max_accounts × test_count × (1+NEG) × 7 KB (Post + CachedPostFeatures); + ~4 GB globals
top_k_ndcg = 20
top_k_recall = 50
max_accounts = 150
max_pages_per_user = 8                # 160 favs/page on e621
seed_owner_token = "calibration-seed"
calibrate_threads = 0                 # 0 = auto = nproc/2
