# Single-service stack. Uses HOST networking because this environment cannot
# create bridge veth pairs (`operation not supported`) — neither for build
# containers nor for runtime. With `network_mode: host` the app binds directly
# to the host port (ROCKET_PORT=8181) and `ports:` is not used. This works on
# any Docker host; it just bypasses the default bridge bridge/NAT layer.
#
# The database lives in `data/`, and `data/` + `media/` are bind-mounted as
# DIRECTORIES. SQLite creates `database.db-wal` / `-shm` next to the database
# file, so with a directory mount they sit on the host and survive `down` /
# `up --build`, which recreate the container and its writable layer. A FILE
# mount (`./database.db:/app/database.db`) instead leaves the journal inside
# the container: `down` then throws away every transaction since the last
# checkpoint, and a kill in the middle of a checkpoint leaves the file
# malformed — that is the 2026-10-13 corruption.
#
# This only works as a pair: the mount AND `db_path = "data/database.db"` in
# config.toml. Change one without the other and the app starts on a fresh,
# empty database inside the container.
#
# Belt and braces, for the paths a mount cannot cover (SIGKILL, OOM, crash):
# the app also folds the WAL into the database on a clean exit (`db::shutdown`)
# and `stop_grace_period` gives that checkpoint room instead of the 10 s
# default.
services:
  app:
    build:
      context: ..
      dockerfile: parser-api/Dockerfile
      network: host
      args:
        FEATURES: ""
    container_name: app
    network_mode: host
    # Ceiling, not a delay: Docker only waits this long if the process is still
    # running. It covers draining in-flight requests and the `db::shutdown`
    # checkpoint, which on a large journal does not fit in the 10 s default.
    stop_grace_period: 1m
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./Rocket.toml:/app/Rocket.toml:ro
      - ./data:/app/data
      - ./media:/app/media
    environment:
      # Under host networking the app binds the host port directly; keep the
      # historical external surface (previously 8181:8080) via ROCKET_PORT.
      - ROCKET_PORT=8181
      # Cap glibc malloc arenas to reduce heap fragmentation on the SQLite write path.
      - MALLOC_ARENA_MAX=2

  app-perf:
    profiles: ["perf"]
    build:
      context: ..
      dockerfile: parser-api/Dockerfile
      network: host
      args:
        FEATURES: "perf_metrics"
    container_name: app-perf
    network_mode: host
    # Ceiling, not a delay: Docker only waits this long if the process is still
    # running. It covers draining in-flight requests and the `db::shutdown`
    # checkpoint, which on a large journal does not fit in the 10 s default.
    stop_grace_period: 1m
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./Rocket.toml:/app/Rocket.toml:ro
      - ./data:/app/data
      - ./media:/app/media
    environment:
      - MALLOC_ARENA_MAX=2

  app-jemalloc:
    profiles: ["jemalloc"]
    build:
      context: ..
      dockerfile: parser-api/Dockerfile
      network: host
      args:
        FEATURES: "jemalloc"
    container_name: app-jemalloc
    network_mode: host
    # Ceiling, not a delay: Docker only waits this long if the process is still
    # running. It covers draining in-flight requests and the `db::shutdown`
    # checkpoint, which on a large journal does not fit in the 10 s default.
    stop_grace_period: 1m
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./Rocket.toml:/app/Rocket.toml:ro
      - ./data:/app/data
      - ./media:/app/media
    environment:
      # Return freed pages to the kernel promptly after cache eviction.
      - MALLOC_CONF=dirty_decay_ms:0,muzzy_decay_ms:0

  app-full:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: parser-api/Dockerfile
      network: host
      args:
        FEATURES: "jemalloc perf_metrics"
    container_name: app-full
    network_mode: host
    # Ceiling, not a delay: Docker only waits this long if the process is still
    # running. It covers draining in-flight requests and the `db::shutdown`
    # checkpoint, which on a large journal does not fit in the 10 s default.
    stop_grace_period: 1m
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./Rocket.toml:/app/Rocket.toml:ro
      - ./data:/app/data
      - ./media:/app/media
    environment:
      - MALLOC_CONF=dirty_decay_ms:0,muzzy_decay_ms:0
      # Cap glibc malloc arenas.
      - MALLOC_ARENA_MAX=2

volumes: {}
