# Single-service stack. Uses HOST networking because this environment cannot
# create bridge veth pairs (`operation not supported`) — neither for build
# containers nor for runtime. With `network_mode: host` the app binds directly
# to the host port (ROCKET_PORT=8181) and `ports:` is not used. This works on
# any Docker host; it just bypasses the default bridge bridge/NAT layer.
#
# The database is bind-mounted as a FILE below, so SQLite keeps
# `database.db-wal` / `-shm` in the container's writable layer and `down` /
# `up --build` discards them together with the container. The app therefore
# folds the WAL into the database before exiting (`db::shutdown`), and
# `stop_grace_period` gives that checkpoint room instead of the 10 s default.
# Mounting `data/` as a directory would remove the hazard entirely, but only
# together with `db_path = "data/database.db"` in config.toml: change the two
# halves together or the app starts on an empty database.
services:
  app:
    build:
      context: ..
      dockerfile: parser-api/Dockerfile
      network: host
      args:
        FEATURES: ""
    container_name: app
    network_mode: host
    # Ceiling, not a delay: Docker only waits this long if the process is still
    # running. A clean close checkpoints the WAL first, which on a large journal
    # does not fit in the 10 s default.
    stop_grace_period: 1m
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./Rocket.toml:/app/Rocket.toml:ro
      - ./database.db:/app/database.db
      - ./media:/app/media
    environment:
      # Under host networking the app binds the host port directly; keep the
      # historical external surface (previously 8181:8080) via ROCKET_PORT.
      - ROCKET_PORT=8181
      # Cap glibc malloc arenas to reduce heap fragmentation on the SQLite write path.
      - MALLOC_ARENA_MAX=2

  app-perf:
    profiles: ["perf"]
    build:
      context: ..
      dockerfile: parser-api/Dockerfile
      network: host
      args:
        FEATURES: "perf_metrics"
    container_name: app-perf
    network_mode: host
    # Ceiling, not a delay: Docker only waits this long if the process is still
    # running. A clean close checkpoints the WAL first, which on a large journal
    # does not fit in the 10 s default.
    stop_grace_period: 1m
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./Rocket.toml:/app/Rocket.toml:ro
      - ./database.db:/app/database.db
      - ./media:/app/media
    environment:
      - MALLOC_ARENA_MAX=2

  app-jemalloc:
    profiles: ["jemalloc"]
    build:
      context: ..
      dockerfile: parser-api/Dockerfile
      network: host
      args:
        FEATURES: "jemalloc"
    container_name: app-jemalloc
    network_mode: host
    # Ceiling, not a delay: Docker only waits this long if the process is still
    # running. A clean close checkpoints the WAL first, which on a large journal
    # does not fit in the 10 s default.
    stop_grace_period: 1m
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./Rocket.toml:/app/Rocket.toml:ro
      - ./database.db:/app/database.db
      - ./media:/app/media
    environment:
      # Return freed pages to the kernel promptly after cache eviction.
      - MALLOC_CONF=dirty_decay_ms:0,muzzy_decay_ms:0

  app-full:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: parser-api/Dockerfile
      network: host
      args:
        FEATURES: "jemalloc perf_metrics"
    container_name: app-full
    network_mode: host
    # Ceiling, not a delay: Docker only waits this long if the process is still
    # running. A clean close checkpoints the WAL first, which on a large journal
    # does not fit in the 10 s default.
    stop_grace_period: 1m
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./Rocket.toml:/app/Rocket.toml:ro
      - ./database.db:/app/database.db
      - ./media:/app/media
    environment:
      - MALLOC_CONF=dirty_decay_ms:0,muzzy_decay_ms:0
      # Cap glibc malloc arenas.
      - MALLOC_ARENA_MAX=2

volumes: {}
