services:
  app:
    build:
      context: ..
      dockerfile: parser-api/Dockerfile
      args:
        FEATURES: ""
    container_name: app
    ports:
      # External 8181 -> container 8080 (the binary binds to Rocket.toml's :8080)
      - "8181:8080"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./Rocket.toml:/app/Rocket.toml:ro
      - ./database.db:/app/database.db
    environment:
      - CONFIG_PATH=/app/config.toml
      # Cap glibc malloc arenas to reduce heap fragmentation on the SQLite write path.
      - MALLOC_ARENA_MAX=2

  app-perf:
    profiles: ["perf"]
    build:
      context: ..
      dockerfile: parser-api/Dockerfile
      args:
        FEATURES: "perf_metrics"
    container_name: app-perf
    ports:
      # External 8181 -> container 8080 (the binary binds to Rocket.toml's :8080)
      - "8181:8080"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./Rocket.toml:/app/Rocket.toml:ro
      - ./database.db:/app/database.db
    environment:
      - CONFIG_PATH=/app/config.toml
      # Cap glibc malloc arenas (no-op under jemalloc).
      - MALLOC_ARENA_MAX=2

  app-jemalloc:
    profiles: ["jemalloc"]
    build:
      context: ..
      dockerfile: parser-api/Dockerfile
      args:
        FEATURES: "jemalloc"
    container_name: app-jemalloc
    ports:
      # External 8181 -> container 8080 (the binary binds to Rocket.toml's :8080)
      - "8181:8080"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./Rocket.toml:/app/Rocket.toml:ro
      - ./database.db:/app/database.db
    environment:
      - CONFIG_PATH=/app/config.toml
      # Return freed pages to the kernel promptly after cache eviction.
      - MALLOC_CONF=dirty_decay_ms:0,muzzy_decay_ms:0
      # Cap glibc malloc arenas (no-op under jemalloc).
      - MALLOC_ARENA_MAX=2

  app-full:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: parser-api/Dockerfile
      args:
        FEATURES: "jemalloc perf_metrics"
    container_name: app-full
    ports:
      # External 8181 -> container 8080 (the binary binds to Rocket.toml's :8080)
      - "8181:8080"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./Rocket.toml:/app/Rocket.toml:ro
      - ./database.db:/app/database.db
    environment:
      - CONFIG_PATH=/app/config.toml
      - MALLOC_CONF=dirty_decay_ms:0,muzzy_decay_ms:0
      # Cap glibc malloc arenas (no-op under jemalloc).
      - MALLOC_ARENA_MAX=2
