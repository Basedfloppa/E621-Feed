# cargo-deny policy for both crates (`static-checks.sh` looks for this file at
# the repository root and runs `cargo deny check` per project).
#
# Split of duties with `cargo audit` (see `.github/workflows/audit.yml`):
#   * cargo-audit owns advisory *frequency* — it runs daily against the advisory
#     database, where ignore lists live in `<crate>/.cargo/audit.toml`.
#   * cargo-deny owns the *supply-chain* rules that do not change under us:
#     which licenses are acceptable, where crates may come from, and whether a
#     wildcard/duplicate dependency sneaks in. This file therefore carries no
#     advisory ignores of its own.

[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Mirrors the accepted-risk decisions recorded in `parser-web/.cargo/audit.toml`
# — the rationale lives there, next to the `cargo audit` runs that also honour
# it, and must not be duplicated (or drift) here:
#   RUSTSEC-2025-0141 (bincode 1.3.3, unmaintained) — transitive via
#                     gloo-worker → gloo → Yew 0.23, not in the shipped bundle.
#   RUSTSEC-2024-0370 (proc-macro-error 1.0.4, unmaintained) — build-time only,
#                     via yew-macro.
# `cargo deny check advisories` reports both as `unmaintained`, which is a hard
# error by default in cargo-deny 0.20. They occur in the `parser-web` tree only,
# so the `parser-api` run would otherwise warn twice per run about an ignore it
# did not need — the same one-config-two-trees situation as the license list.
unused-ignored-advisory = "allow"
ignore = ["RUSTSEC-2025-0141", "RUSTSEC-2024-0370"]

[licenses]
# One config serves both dependency trees, so this list is their union: `cargo
# deny check licenses` for `parser-api` uses every entry below, for `parser-web`
# a few are unused. Reporting that as a warning on every web run would train the
# reader to ignore the warning class, so unused entries are allowed here; the
# API run is the one that proves the list is not stale.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# First-party crates declare `license = "MIT-0"` in their manifests, so they are
# checked like any other crate; nothing is exempt here.
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
# Only crates.io: a dependency that starts resolving from a git branch or a
# third-party registry is a supply-chain change that should be reviewed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
