[[bin]]
name = "e621-account-parser-web"
path = "src/main.rs"

[package]
name = "e621-account-parser-web"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = { version = "0.2", features = [] }
web-sys = { version = "0.3", features = [
  "Window",
  "Crypto",
  "Storage",
  "StorageEvent",
  "HtmlElement",
  "HtmlSelectElement",
  "HtmlVideoElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "TextMetrics",
  "CssStyleDeclaration",
  "MutationObserver",
  "MutationObserverInit",
  "MutationRecord",
  "Node",
  "AbortController",
  "AbortSignal",
  "Request",
  "RequestInit",
  "Response",
  "console",
  "ResizeObserver",
  "ResizeObserverEntry",
  "DomRect",
  "DomRectReadOnly",
  "Element",
  "WheelEvent",
  "AddEventListenerOptions",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "CustomEvent",
  "EventTarget",
  "MediaQueryList",
] }
urlencoding = "2"
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
reqwasm = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = ">=0.4.38, <0.5", features = ["serde", "wasmbind"] }
serde-wasm-bindgen = "0.6"
gloo-timers = "0.3"
