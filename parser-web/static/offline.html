<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Can't reach E621 Feed</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: light-dark(#f6f7f9, #111827);
        color: light-dark(#1f2937, #e5e7eb);
        padding: 24px;
      }
      .card {
        max-width: 380px;
        width: 100%;
        text-align: center;
        background: light-dark(#ffffff, #1f2937);
        border: 1px solid light-dark(#e5e7eb, #374151);
        border-radius: 12px;
        padding: 28px 22px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: light-dark(#4b5563, #9ca3af);
      }
      button {
        margin-top: 18px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #0d6efd;
        border: 0;
        border-radius: 9999px;
        padding: 10px 22px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card" role="alert">
      <h1>Can't reach E621 Feed</h1>
      <p>
        You appear to be offline and this site hasn't been visited on this
        device yet, so there's nothing saved to show. Check your connection and
        try again.
      </p>
      <button id="retry" type="button">Try again</button>
    </div>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
